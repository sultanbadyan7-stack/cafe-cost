<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CaféCost — a free, bilingual café break-even and cash-flow calculator for busy café owners."
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#F8FAFC"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0F172A"
    />
    <script>
      /* Apply the saved theme before first paint to avoid a flash of light UI. */
      (function () {
        try {
          var key = 'cafecost.theme.v1';
          var stored = window.localStorage.getItem(key);
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* Private mode or blocked storage: keep the light default. */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CaféCost — Free Café Break-Even Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
